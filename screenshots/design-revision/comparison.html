<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Design comparison · immich-go desktop</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; background: #faf9f7; color: #252321; font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif; }
      main { max-width: 1440px; margin: 0 auto; padding: 36px; }
      header { margin-bottom: 30px; }
      h1 { margin: 0 0 8px; font-size: 30px; font-weight: 500; letter-spacing: -.04em; }
      header p, figcaption p { margin: 0; color: #706b65; font-size: 14px; line-height: 1.6; }
      .comparison { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
      .section-title { margin: 36px 0 18px; font-size: 22px; }
      figure { min-width: 0; margin: 0; }
      .label { display: inline-block; margin-bottom: 12px; padding: 6px 12px; border-radius: 99px; background: #edeae6; font-size: 12px; }
      .after { background: #ffe6d1; color: #784022; }
      img { display: block; width: 100%; border: 1px solid #e8e3dd; border-radius: 16px; }
      a { color: inherit; text-underline-offset: 3px; }
      figure > a { display: block; border-radius: 16px; }
      a:focus-visible { outline: 2px solid #252321; outline-offset: 5px; }
      figcaption { padding: 17px 0 0; }
      h2 { margin: 0 0 5px; font-size: 17px; font-weight: 500; }
      footer { margin-top: 30px; padding-top: 18px; border-top: 1px solid #e8e3dd; color: #706b65; font-size: 12px; }
      @media (max-width: 640px) { main { padding: 22px; } .comparison { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>Published app → Latest design</h1>
        <p>The <a href="https://blickoneblickytwo.github.io/immich-go-desktop/" target="_blank" rel="noreferrer">published baseline</a>, captured October 9, and the <a href="/">newest local revision</a>, captured October 15, 2026. Both at 1280 × 900. Click an image to view it in full.</p>
      </header>
      <div class="comparison">
        <figure>
          <span class="label">Live</span>
          <a href="before.jpg" target="_blank" rel="noopener"><img src="before.jpg" alt="Published app with a landscape background, four source tiles, a logo header, and a numbered stepper" /></a>
          <figcaption><h2>The published app</h2><p>Landscape artwork, window chrome, a full stepper, and four source tiles.</p></figcaption>
        </figure>
        <figure>
          <span class="label after">Latest local</span>
          <a href="after.jpg" target="_blank" rel="noopener"><img src="after.jpg" alt="Minimal app on a plain light background with peach, cream, and lilac card artwork" /></a>
          <figcaption><h2>A quieter visual direction</h2><p>A plain light backdrop, soft card artwork, and a compact Go Desktop logo. One selector, one action, fluid transitions, and reduced-motion support.</p></figcaption>
        </figure>
      </div>
      <h2 class="section-title">Settings</h2>
      <div class="comparison">
        <figure>
          <span class="label">Live</span>
          <a href="settings-live.jpg" target="_blank" rel="noopener"><img src="settings-live.jpg" alt="Privacy tab in the published Settings dialog" /></a>
          <figcaption><h2>The published Settings</h2><p>The original privacy information and controls.</p></figcaption>
        </figure>
        <figure>
          <span class="label after">Latest local</span>
          <a href="settings-after.jpg" target="_blank" rel="noopener"><img src="settings-after.jpg" alt="Revised Settings with segmented tabs, clear privacy sections, and saved-connection status" /></a>
          <figcaption><h2>Clearer and easier to scan</h2><p>Reviewed privacy wording, explicit key-storage and export details, saved-connection controls, expandable help, and scrolling within the dialog.</p></figcaption>
        </figure>
      </div>
      <footer>Local design preview · No publishing or deployment</footer>
    </main>
  </body>
</html>
